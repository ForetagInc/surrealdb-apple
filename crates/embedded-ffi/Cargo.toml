[package]
name = 'embedded-ffi'
version = '0.1.0'
edition = '2024'

[lib]
crate-type = ['staticlib']

[dependencies]
surrealdb_embedded = { package = 'embedded-core', path = '../embedded-core' }
libc = '0.2'
once_cell = '1'
tokio = { version = '1', features = ['rt', 'sync'] }
serde = { version = '1', features = ['derive'] }
serde_json = '1'
serde_cbor = '0.11'
surrealdb = { version = '3.0.1', default-features = false, features = ['kv-mem', 'kv-surrealkv'] }
